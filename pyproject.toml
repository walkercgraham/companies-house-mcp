[project]
name = "uk-companies-house-mcp"
version = "0.0.1"
description = "Read-only MCP server for the UK Companies House register, with a reproducible tool-use eval."
readme = "README.md"
license = "MIT"
authors = [{ name = "Walker Graham" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/companies_house_mcp"]

# ---------- ruff: lint + format ----------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "UP",       # pyupgrade: modern syntax
    "SIM",      # simplifications
    "RUF",      # ruff-specific
]

# ---------- mypy: strict typing ----------
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "live: hits the real Companies House API (needs COMPANIES_HOUSE_API_KEY, run with -m live)",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]
